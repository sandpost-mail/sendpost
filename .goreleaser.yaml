# Release build, run by .github/workflows/release.yml on a v* tag.
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: sandpost

before:
  hooks:
    # The UI is embedded with go:embed, so it must be built before the binaries.
    - make web

builds:
  - id: sandpost
    main: ./cmd/sandpost
    binary: sandpost
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible builds: file times come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  # v1.2.0-rc.1 and similar are published as pre-releases.
  prerelease: auto
  footer: |
    Container image: `ghcr.io/{{ envOrDefault "IMAGE_NAME" "sandpost-mail/sendpost" }}:{{ .Version }}`

    Verify a downloaded archive: `gh attestation verify <file> --repo {{ envOrDefault "GITHUB_REPOSITORY" "sandpost-mail/sendpost" }}`
