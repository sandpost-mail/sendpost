# Local development stack: Postgres, a one-shot migration, and the app.
# Usage: cp deploy/.env.example deploy/.env (set SECRET_KEY), then
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
name: sandpost

x-app-env: &app-env
  DATABASE_URL: postgres://sandpost:${POSTGRES_PASSWORD:-sandpost}@db:5432/sandpost?sslmode=disable
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (openssl rand -hex 32), see deploy/.env.example}
  HTTP_LISTEN: ":8080"
  SMTP_LISTEN: ":1025"
  LOG_FORMAT: text

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sandpost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandpost}
      POSTGRES_DB: sandpost
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandpost -d sandpost"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["migrate", "up"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve"]
    environment: *app-env
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
