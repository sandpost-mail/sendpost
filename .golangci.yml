version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    generated: lax
    paths:
      - internal/store/sqlcgen
    rules:
      # The seed script writes French sample mail on purpose.
      - path: scripts/seedmail/
        linters:
          - misspell
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sandpost-mail/sandpost
